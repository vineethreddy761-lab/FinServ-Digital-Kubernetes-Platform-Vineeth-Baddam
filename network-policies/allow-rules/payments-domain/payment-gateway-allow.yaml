apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-gateway-flows
  namespace: production-payments
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          domain: platform
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api-gateway
    ports:
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: transaction-processor
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - namespaceSelector:
        matchLabels:
          domain: risk-compliance
      podSelector:
        matchLabels:
          app.kubernetes.io/name: fraud-detection
    ports:
    - protocol: TCP
      port: 8443
  - to: # Allow DNS
    namespaceSelector: {}
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
