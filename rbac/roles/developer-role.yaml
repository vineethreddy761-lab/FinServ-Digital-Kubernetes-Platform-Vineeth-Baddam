apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: production-payments
  name: payments-developer-role
  labels:
    security.finserv.io/persona: developer
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "services", "deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
