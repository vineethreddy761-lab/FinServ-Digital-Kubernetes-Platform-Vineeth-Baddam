apiVersion: v1
kind: LimitRange
metadata:
  name: payments-limits
  namespace: production-payments
spec:
  limits:
  - default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: "500m"
      memory: 512Mi
    type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: risk-limits
  namespace: production-risk
spec:
  limits:
  - default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: "500m"
      memory: 512Mi
    type: Container
