apiVersion: v1
kind: ResourceQuota
metadata:
  name: payments-quota
  namespace: production-payments
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: risk-quota
  namespace: production-risk
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "24"
    limits.memory: 48Gi
    pods: "40"
    services: "15"
    persistentvolumeclaims: "8"
